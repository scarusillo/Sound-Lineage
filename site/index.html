<header class="appbar" id="appbar">
  <button class="ibtn appback" id="appback" aria-label="Back" hidden><svg><use href="#i-back"/></svg></button>
  <a class="brand" href="#today" aria-label="Sound Lineage home">
    <span class="mark" aria-hidden="true"></span>
    <span class="brand-t" id="apptitle">Sound Lineage</span>
  </a>
  <div class="search" id="searchwrap">
    <svg class="sicon" aria-hidden="true"><use href="#i-search"/></svg>
    <label for="q" class="sr">Search artists, albums and songs</label>
    <input id="q" type="search" placeholder="Artists, albums, songs" autocomplete="off" enterkeyhint="search">
    <button class="ibtn scancel" id="scancel" aria-label="Close search"><svg><use href="#i-close"/></svg></button>
    <div id="qres" class="qres" hidden></div>
  </div>
  <button class="ibtn sopen" id="sopen" aria-label="Search"><svg><use href="#i-search"/></svg></button>
</header>

<nav class="rail" aria-label="Main">
  <a class="brand" href="#today" aria-label="Sound Lineage home"><span class="mark" aria-hidden="true"></span><span class="brand-t">Sound Lineage</span></a>
  <div class="rail-nav">
    <a href="#today" data-view="today"><svg><use href="#i-home"/></svg>Home</a>
    <a href="#map" data-view="map"><svg><use href="#i-map"/></svg>Map</a>
    <a href="#tree" data-view="tree"><svg><use href="#i-tree"/></svg>Lineage</a>

    <a href="#browse" data-view="browse"><svg><use href="#i-grid"/></svg>Browse</a>
    <a href="#credits" data-view="credits"><svg><use href="#i-credits"/></svg>Behind the music</a>
    <a href="#journeys" data-view="journeys"><svg><use href="#i-route"/></svg>Journeys</a>
    <a href="#play" data-view="play"><svg><use href="#i-games"/></svg>Games</a>
  </div>
  <p class="rail-foot">Influence links come from interviews, biographies and music histories. Every pick is human-curated.</p>
</nav>

<main id="main">
  <section id="view-today" class="view"></section>
  <section id="view-map" class="view mapview" hidden>
    <div class="map-wrap" id="mapwrap">
      <div id="graph3d" class="g3d" hidden></div>
      <canvas id="graph" aria-label="Network map of musical influence" hidden></canvas>
      <canvas id="citymap" aria-label="World map of music cities" hidden></canvas>
      <p class="citynote" id="citynote" hidden></p>
      <div id="labels" class="labels" aria-hidden="true"></div>
      <div class="map-top">
        <div class="seg dark" role="group" aria-label="Map style"><button data-mapmode="3d">3D</button><button data-mapmode="flat">Flat</button><button data-mapmode="cities">Cities</button></div>
        <button class="mbtn" id="mapfilterbtn" aria-label="Filter genres" aria-expanded="false"><svg><use href="#i-filter"/></svg><span id="mapfiltern">Genres</span></button>
        <button class="mbtn" id="mapinfobtn" aria-label="How to read the map" aria-expanded="false"><svg><use href="#i-info"/></svg></button>
      </div>
      <div class="map-pop" id="mappop" hidden>
        <p class="map-lede" id="maplede"></p>
        <div class="map-filter" id="mapfilter" role="group" aria-label="Show genres"></div>
        <div class="map-filter scenes" id="scenes" role="group" aria-label="Music scenes" hidden></div>
      </div>
      <div class="map-tools">
        <button id="zin" aria-label="Zoom in">+</button>
        <button id="zout" aria-label="Zoom out">−</button>
        <button id="zfit" aria-label="Fit map">Fit</button>
      </div>
      <div class="map-hud" id="hud">
        <button class="hud-play" id="playhist" aria-label="Play the history of music"><svg><use href="#i-play"/></svg><span>History</span></button>
        <input id="era" type="range" min="0" max="12" value="12" aria-label="Show artists up to this decade">
        <span id="eralabel" class="mono">2020s</span>
      </div>
      <div class="map-focus" id="mapfocus" hidden></div>
      <div id="tip" class="tip" hidden></div>
      <div class="bigyear mono" id="bigyear" hidden></div>
    </div>
  </section>
  <section id="view-tree" class="view" hidden></section>
  <section id="view-mix" class="view" hidden></section>
  <section id="view-journeys" class="view" hidden></section>
  <section id="view-play" class="view" hidden></section>
  <section id="view-browse" class="view" hidden></section>
  <section id="view-credits" class="view" hidden></section>
  <section id="view-compare" class="view" hidden></section>
  <section id="view-ask" class="view" hidden></section>
  <section id="view-wrapped" class="view" hidden></section>
  <section id="view-you" class="view" hidden></section>
</main>

</aside>

  <div id="queuebody"></div>
</aside>
